<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poker bot</title>
<style>
  :root { color-scheme: dark; --bg:#0e1014; --panel:#171a21; --panel2:#1d212a; --line:#2a2f3a; --line2:#373d4a; --text:#e8eaed; --muted:#98a0ad; --accent:#8ab4ff; --good:#3ecf6e; --warn:#f0b429; --bad:#f2625f; }
  * { box-sizing: border-box; }
  body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); margin: 0; width: 340px; padding: 14px; }
  h1 { font-size: 15px; margin: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .ver { color: var(--muted); font-size: 11px; }
  .box { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; }
  .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
  label { display: flex; gap: 8px; align-items: flex-start; margin: 5px 0; cursor: pointer; }
  label input { margin-top: 3px; accent-color: var(--accent); flex: none; }
  .muted { color: var(--muted); font-size: 12px; }
  button { font: inherit; border-radius: 7px; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); padding: 6px 10px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #stop { background: #c62828; border-color: #c62828; font-weight: 700; width: 100%; padding: 9px; margin-bottom: 10px; }
  #stop.clear { background: #2e7d32; border-color: #2e7d32; }
  #state { font-weight: 600; margin-bottom: 10px; padding: 8px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line2); }
  #state.good { border-left-color: var(--good); } #state.warn { border-left-color: var(--warn); } #state.bad { border-left-color: var(--bad); }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .tablehead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #tablename { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tableid { font: 11px ui-monospace, Consolas, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line2); white-space: nowrap; flex: none; }
  .tag.good { color: var(--good); border-color: #2c5a3c; background: #14301f; } .tag.muted { color: var(--muted); }
  .others { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .link { background: transparent; border-color: transparent; color: var(--accent); padding: 2px 4px; }
</style>
</head>
<body>
  <div class="top"><h1>Poker bot</h1><span class="ver" id="ver"></span></div>
  <div id="state" role="status"></div>
  <button id="stop" type="button">EMERGENCY STOP</button>
  <div class="box">
    <div class="label">Mode</div>
    <label><input type="radio" name="mode" value="manual"> <span>Manual: observe and profile only</span></label>
    <label><input type="radio" name="mode" value="recommend"> <span>Recommend: show decisions, never click</span></label>
    <label><input type="radio" name="mode" value="autonomous"> <span>Autonomous: act for the seat (authorised tables only)</span></label>
  </div>
  <div class="box">
    <div class="label">This table</div>
    <div class="tablehead"><span id="tablename">Not on a PokerNow table</span><span class="tag muted" id="authtag">–</span></div>
    <div id="tableid"></div>
    <label style="margin-top:8px"><input type="checkbox" id="auth"> <span>I confirm automated play is authorised by the organiser of the tables I authorise (bot competition).</span></label>
    <div class="row" style="margin-top:6px"><button id="allow" type="button">Authorise this table</button><button id="revoke" type="button">Revoke</button></div>
    <div class="others"><span class="muted" id="others"></span><button id="manage" class="link" type="button">Manage tables</button></div>
  </div>
  <div class="row"><button id="dash" type="button">Open dashboard</button></div>
</body>
</html>
